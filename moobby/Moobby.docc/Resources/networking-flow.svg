F" stroke="#0071E3" stroke-width="1.5"/><text x="356.0" y="239" class="mono" fill="#1D1D1F">APIConfig.baseURL</text><text x="356.0" y="262" class="sub" fill="#6E6E73">chosen by AppEnvironment</text><line x1="356.0" y1="206" x2="356.0" y2="112" stroke="#6E6E73" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a6E6E73)"/><rect x="520" y="206" width="176" height="78" rx="14" fill="#FDEDEC" stroke="#D70015" stroke-width="1.5"/><text x="608.0" y="239" class="mono" fill="#1D1D1F">throws</text><text x="608.0" y="262" class="sub" fill="#6E6E73">APIError · URLError</text><line x1="608.0" y1="108" x2="608.0" y2="202" stroke="#D70015" stroke-width="2" marker-end="url(#aD70015)"/><text x="618.0" y="151.0" class="lbl side" fill="#6E6E73">non-2xx</text><text x="618.0" y="167.0" class="lbl side" fill="#6E6E73">bad JSON · offline</text>
