name: moobby
options:
  bundleIdPrefix: com.appleacademy
  deploymentTarget:
    iOS: "26.5"

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: FU4TVB538X

targets:
  moobby:
    type: application
    platform: iOS
    sources:
      - path: moobby
    scheme:
      testTargets:
        - moobbyUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appleacademy.moobby
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID is used to demonstrate biometric authentication in the UI Components catalog."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shows your position and route on the map."
        CODE_SIGN_STYLE: Automatic
        DOCC_MINIMUM_ACCESS_LEVEL: internal

  moobbyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: moobbyUITests
    dependencies:
      - target: moobby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appleacademy.moobbyUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
